# Netlify picks Astro up on its own, but pinning the build here means the site
# deploys the same way from a laptop, from CI, and from a fresh clone — rather
# than depending on whatever Netlify guesses that day.
#
# The Astro Netlify adapter writes the static pages to dist/ and the server
# routes to .netlify/, so `publish` is dist/ and nothing else needs configuring.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro emits fingerprinted asset filenames, so those can be cached forever.
# The pages themselves must not be, or a deploy would not reach anyone.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
